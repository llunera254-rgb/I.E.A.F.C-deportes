<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Administrativo | Instituto Aureliano Flores Cardona</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f6f5;
}

/* LOGIN */

#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    
}

.login-card{
    background:white;
    width:400px;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.login-card h2{
    text-align:center;
    color:#0d5c2e;
    margin-bottom:30px;
}

.login-card input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

.login-card button{
    width:100%;
    padding:14px;
    background:#198754;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

/* DASHBOARD */

#dashboard{
    display:none;
}

.sidebar{
    position:fixed;
    width:260px;
    height:100vh;
    background:#0d5c2e;
    color:white;
    padding:25px;
}

.sidebar h2{
    margin-bottom:40px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:15px;
}

.sidebar a{
    color:white;
    text-decoration:none;
    display:block;
    padding:12px;
    border-radius:10px;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.main{
    margin-left:260px;
    padding:40px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
    color:#0d5c2e;
    margin-bottom:20px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    background:#198754;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#0d5c2e;
}

/* VISTA PREVIA */

.preview-item{
    background:#eef8f0;
    padding:20px;
    border-left:5px solid #198754;
    margin-bottom:15px;
    border-radius:8px;
}

.preview-item h4{
    color:#0d5c2e;
    margin-bottom:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.stat-box{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.stat-box h2{
    color:#198754;
}

@media(max-width:768px){

.sidebar{
    position:relative;
    width:100%;
    height:auto;
}

.main{
    margin-left:0;
}

}

</style>

</head>

<body>

<!-- LOGIN -->

<section id="login">

```
<div class="login-card">

    <h2>Panel Administrativo</h2>

    <input type="text" id="user" placeholder="Usuario">

    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="login()">
        Ingresar
    </button>

</div>
```

</section>

<!-- DASHBOARD -->

<section id="dashboard">

```
<div class="sidebar">

    <h2>I.E.A.F.C. Deportes</h2>

    <ul>
        <li><a href="#inicio">🏠 Inicio</a></li>
        <li><a href="#noticias">📰 Noticias</a></li>
        <li><a href="#eventos">📅 Eventos</a></li>
        <li><a href="#galeria">🖼️ Galería</a></li>
        <li><a href="index.html">🌐 Ver Sitio</a></li>
    </ul>

</div>

<div class="main">

    <div class="stats">

        <div class="stat-box">
            <h2>15</h2>
            <p>Noticias</p>
        </div>

        <div class="stat-box">
            <h2>8</h2>
            <p>Eventos</p>
        </div>

        <div class="stat-box">
            <h2>52</h2>
            <p>Galería</p>
        </div>

    </div>

    <br>

    <div class="card" id="noticias">

        <h3>Crear Noticia</h3>

        <input type="text" id="tituloNoticia" placeholder="Título de la noticia">

        <textarea id="contenidoNoticia" placeholder="Contenido"></textarea>

        <button onclick="publicarNoticia()">
            Publicar Noticia
        </button>

    </div>

    <div class="card" id="eventos">

        <h3>Crear Evento</h3>

        <input type="text" id="tituloEvento" placeholder="Nombre del evento">

        <input type="date" id="fechaEvento">

        <textarea id="descripcionEvento" placeholder="Descripción"></textarea>

        <button onclick="publicarEvento()">
            Publicar Evento
        </button>

    </div>

    <div class="card" id="galeria">

        <h3>Galería</h3>

        <input type="file" multiple>

        <button>
            Subir Imágenes
        </button>

    </div>

    <div class="card">

        <h3>Vista Previa de Publicaciones</h3>

        <div id="publicaciones"></div>

    </div>

</div>
```

</section>

<script>

function login(){

    let usuario=document.getElementById('user').value;
    let password=document.getElementById('password').value;

    if(usuario==="admin" && password==="1234"){

        document.getElementById('login').style.display='none';
        document.getElementById('dashboard').style.display='block';

    }else{

        alert("Usuario o contraseña incorrectos");

    }

}

function publicarNoticia(){

    let titulo =
    document.getElementById('tituloNoticia').value;

    let contenido =
    document.getElementById('contenidoNoticia').value;

    if(titulo === ""){

        alert("Ingrese un título");
        return;

    }

    let noticias =
    JSON.parse(localStorage.getItem('noticias')) || [];

    let nuevaNoticia = {

        titulo: titulo,

        contenido: contenido,

        fecha: new Date().toLocaleDateString(),

        imagen: ""

    };

    noticias.push(nuevaNoticia);

    localStorage.setItem(
        'noticias',
        JSON.stringify(noticias)
    );

    document.getElementById('publicaciones').innerHTML += `

        <div class="preview-item">

            <h4>📰 ${titulo}</h4>

            <p>${contenido}</p>

        </div>

    `;

    document.getElementById('tituloNoticia').value = "";
    document.getElementById('contenidoNoticia').value = "";

    alert("Noticia publicada correctamente");
 console.log(localStorage.getItem('noticias'));

}
function publicarEvento(){

    let titulo=document.getElementById('tituloEvento').value;
    let fecha=document.getElementById('fechaEvento').value;
    let descripcion=document.getElementById('descripcionEvento').value;

    if(titulo==="") return;

    document.getElementById('publicaciones').innerHTML += `
        <div class="preview-item">
            <h4>📅 ${titulo}</h4>
            <strong>${fecha}</strong>
            <p>${descripcion}</p>
        </div>
    `;

}

</script>

</body>
</html>
